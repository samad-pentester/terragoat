name: IaC Security Scan (Checkov + Trivy + KICS)

on:
  # Run on push to main, and allow manual runs
  push:
    branches: [ main ]
  workflow_dispatch:              # Manual trigger from Actions tab

jobs:
  # -------------------------
  # Job 1: BUILD STAGE (Terraform sanity)
  # -------------------------
  build:
    runs-on: ubuntu-latest        # GitHub-hosted Ubuntu runner

    steps:
      # Get TerraGoat code into the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Terraform CLI
      - name: Install Terraform
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
          sudo unzip terraform.zip -d /usr/local/bin
          terraform -version

      # Basic Terraform checks (format + validate)
      - name: Terraform fmt and validate
        run: |
          terraform fmt -check || true      # Check formatting; don't block learning
          terraform init -backend=false     # Init without real backend
          terraform validate                # Validate Terraform files

  # -------------------------
  # Job 2: TEST STAGE (IaC scanners: Checkov + Trivy + KICS)
  # -------------------------
  test:
    runs-on: ubuntu-latest        # Same runner type as build
    needs: build                  # Only run scanners if build passed

    steps:
      # Get TerraGoat code into this job
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Python for Checkov
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Checkov via pip
      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      # Run Checkov against Terraform and generate HTML report (via JSON + converter)
      - name: Run Checkov and generate HTML
        run: |
          # Scan Terraform directory and output JSON
          checkov -d . --framework terraform -o json > checkov-report.json
          # Simple HTML wrapper using jq and pre tag (learning-friendly)
          echo "<html><body><h1>Checkov Report (JSON)</h1><pre>" > checkov-report.html
          cat checkov-report.json >> checkov-report.html
          echo "</pre></body></html>" >> checkov-report.html

      # Install Trivy CLI
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/install.sh | sudo sh
          trivy -v

      # Run Trivy config scan and generate HTML report
      - name: Run Trivy config scan and generate HTML
        run: |
          # Scan Terraform/IaC configs and output HTML
          trivy config --format html -o trivy-report.html .

      # Install KICS CLI
      - name: Install KICS
        run: |
          curl -fsSL https://github.com/Checkmarx/kics/releases/latest/download/kics-linux-amd64.tar.gz -o kics.tar.gz
          tar -xzf kics.tar.gz
          chmod +x kics

      # Run KICS scan and generate HTML report
      - name: Run KICS scan and generate HTML
        run: |
          # Scan Terraform directory and output HTML report
          ./kics scan -p . -o kics-report.html --report-formats html

      # Upload all three HTML reports as artifacts
      - name: Upload IaC HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: iac-multi-scanners-html-reports
          path: |
            checkov-report.html
            trivy-report.html
            kics-report.html