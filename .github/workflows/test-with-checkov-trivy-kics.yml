name: IaC Security Scan (Checkov only)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------
  # Job 1: BUILD STAGE (Terraform sanity)
  # -------------------------
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
          sudo unzip terraform.zip -d /usr/local/bin
          terraform -version

      - name: Terraform fmt and validate
        run: |
          terraform fmt -check || true
          terraform init -backend=false
          terraform validate

  # -------------------------
  # Job 2: TEST STAGE (Checkov)
  # -------------------------
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov and generate HTML
        run: |
          checkov -d . --framework terraform -o html > checkov-report.html 

      # --- Trivy temporarily disabled ---
      # - name: Install Trivy
      #   run: |
      #     curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
      #       | sudo sh -s -- -b /usr/local/bin
      #     trivy --version
      #
      # - name: Run Trivy config scan and generate HTML
      #   run: |
      #     trivy config --format html -o trivy-report.html . 

      # Upload only Checkov HTML report as artifact
      - name: Upload IaC HTML reports
        uses: actions/upload-artifact@v4
        with:
          name: iac-checkov-html-report
          path: |
            checkov-report.html
            # trivy-report.html